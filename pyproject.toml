[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-starrygl-lib"
version = "0.1.0"
description = "Slim CTDG/DTDG runtime library extracted from StarryUniGraph."
requires-python = ">=3.10"
dependencies = [
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
